{% extends 'core/base.html' %}
{% block content %}
<div class="container py-5">
    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">
            <h4 class="fw-bold text-primary"><i class="fas fa-file-excel me-2"></i>นำเข้าวัตถุดิบจาก Excel</h4>
            <hr>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3">
                    <input type="file" name="excel_file" class="form-control" accept=".xlsx" required>
                </div>
                <button type="submit" class="btn btn-success rounded-pill px-4">อัปโหลดข้อมูล</button>
                <a href="{% url 'product_list' %}?type=RM" class="btn btn-secondary rounded-pill px-4">ย้อนกลับ</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
