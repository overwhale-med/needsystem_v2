version: '3.8'

services:
  web:
    build: .
    container_name: need_system_v2
    restart: always
    ports:
      - "8009:8000"
    volumes:
      # Isolated persistent data volume outside Git repository
      - ../data/db.sqlite3:/app/db.sqlite3
      - ../data/media:/app/media
    environment:
      - SECRET_KEY=yolo-mode-secret-key-need-system
      - DEBUG=True
      - ALLOWED_HOSTS=*
    networks:
      - need_software_network

networks:
  need_software_network:
    name: need_software_network
    external: true
