{% extends 'core/base.html' %}

{% block content %}
<style>
    .btn-gold { background: linear-gradient(135deg, #d4af37 0%, #aa8c2c 100%); color: #ffffff !important; border: none; transition: all 0.3s ease; }
    .btn-gold:hover { background: linear-gradient(135deg, #aa8c2c 0%, #8c7324 100%); transform: translateY(-2px); box-shadow: 0 4px 8px rgba(212, 175, 55, 0.3) !important; }
</style>

<div class="container py-5" style="max-width: 600px;">
    <div class="card border-0 shadow-sm rounded-4 bg-white">
        <div class="card-header bg-white py-4 border-bottom-0 text-center">
            <div class="d-inline-flex align-items-center justify-content-center bg-warning bg-opacity-10 text-warning rounded-circle mb-3" style="width: 60px; height: 60px; font-size: 1.5rem;">
                <i class="fas fa-bolt"></i>
            </div>
            <h4 class="fw-bold text-dark mb-0">สร้างงานด่วน (Quick Job)</h4>
            <p class="text-muted small mt-1 mb-0">สำหรับเพิ่มงานเข้า Center โดยตรง</p>
        </div>
        
        <div class="card-body px-5 pb-5 pt-2">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label fw-bold small text-muted">เลือกลูกค้า (Customer)</label>
                    <select name="customer_id" class="form-select form-select-lg fs-6" required>
                        <option value="">-- กรุณาเลือกลูกค้า --</option>
                        {% for c in customers %}
                        <option value="{{ c.id }}">{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-5">
                    <label class="form-label fw-bold small text-muted">เลือกแพ็กเกจโซล่า (FG Package)</label>
                    <select name="package_id" class="form-select form-select-lg fs-6" required>
                        <option value="">-- กรุณาเลือกแพ็กเกจ --</option>
                        {% for p in packages %}
                        <option value="{{ p.id }}">{{ p.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="d-flex gap-2">
                    <a href="{% url 'solar_center_dashboard' %}" class="btn btn-light rounded-pill px-4 fw-bold w-50">ยกเลิก</a>
                    <button type="submit" class="btn btn-gold rounded-pill px-4 fw-bold shadow-sm w-50">
                        <i class="fas fa-plus-circle me-1"></i> สร้างงาน
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
